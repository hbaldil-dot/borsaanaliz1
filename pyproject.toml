[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "borsaanaliz1"
version = "2.0.0"
description = "BIST AI Analiz Motoru"
authors = [{name = "hbaldil-dot"}]
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pymongo>=4.10.1",
    "pandas>=2.2.3",
    "numpy>=1.26.4",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.4",
    "yfinance>=0.2.41",
    "ta>=0.10.2",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1.0",
    "pytz>=2024.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "black>=24.10.0",
    "flake8>=7.1.1"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

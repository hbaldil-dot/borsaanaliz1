<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borsa Analiz & AI Panel</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .main-container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; height: 85vh; }
        
        .sidebar { flex: 1; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 15px; }
        .search-box { display: flex; gap: 5px; }
        .search-box input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 5px; text-transform: uppercase; }
        .search-box button { padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        
        .stock-list { display: flex; gap: 5px; flex-wrap: wrap; }
        .stock-btn { padding: 6px 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .stock-card { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ddd; flex: 1; overflow-y: auto; }
        
        .chat-container { flex: 2; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .chat-box { flex: 1; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 5px; max-width: 80%; }
        .user { background: #007bff; color: white; margin-left: auto; }
        .bot { background: #e9ecef; color: black; }
        .input-box { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button.send-btn { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="main-container">
    <!-- SOL TARAF: Borsa Hisseleri & Arama -->
    <div class="sidebar">
        <h3>BIST Hisse Sorgula</h3>
        <div class="search-box">
            <input type="text" id="symbolInput" placeholder="Hisse Kodu (Örn: ASELS)" onkeypress="if(event.key==='Enter') searchCustomStock()">
            <button onclick="searchCustomStock()">Getir</button>
        </div>

        <div class="stock-list">
            <button class="stock-btn" onclick="fetchStock('THYAO')">THYAO</button>
            <button class="stock-btn" onclick="fetchStock('GARAN')">GARAN</button>
            <button class="stock-btn" onclick="fetchStock('EREGL')">EREGL</button>
            <button class="stock-btn" onclick="fetchStock('AKBNK')">AKBNK</button>
            <button class="stock-btn" onclick="fetchStock('SASA')">SASA</button>
            <button class="stock-btn" onclick="fetchStock('ASELS')">ASELS</button>
            <button class="stock-btn" onclick="fetchStock('KCHOL')">KCHOL</button>
            <button class="stock-btn" onclick="fetchStock('TUPRS')">TUPRS</button>
        </div>

        <div class="stock-card" id="stockCard">
            <h4>Hisse Seçin veya Arayın</h4>
            <p>Son 3 yıla ait kâr durumu ve anlık fiyat için yukarıya BIST hisse kodunu yazabilirsiniz.</p>
        </div>
    </div>

    <!-- SAĞ TARAF: Yapay Zeka Sohbeti -->
    <div class="chat-container">
        <h3>Yapay Zeka Asistanı</h3>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Mesajınızı yazın..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">Gönder</button>
        </div>
    </div>
</div>

<script>
    function searchCustomStock() {
        const symbol = document.getElementById("symbolInput").value.trim();
        if (symbol) {
            fetchStock(symbol);
        }
    }

    async function fetchStock(symbol) {
        const card = document.getElementById("stockCard");
        card.innerHTML = `<p><strong>${symbol.toUpperCase()}</strong> verileri yükleniyor...</p>`;

        try {
            const res = await fetch(`/api/stock/${symbol}`);
            const data = await res.json();

            if (data.error) {
                card.innerHTML = `<p style="color:red;">Hata: ${data.error}</p>`;
                return;
            }

            let profitHTML = "<ul>";
            if (typeof data.profits === 'object') {
                for (const [year, netProfit] of Object.entries(data.profits)) {
                    profitHTML += `<li><strong>${year}:</strong> ${netProfit}</li>`;
                }
                profitHTML += "</ul>";
            } else {
                profitHTML = `<p>${data.profits}</p>`;
            }

            card.innerHTML = `
                <h4>${data.symbol} Detayı</h4>
                <p><strong>Güncel Fiyat (15 dk gecikmeli):</strong> ${data.price}</p>
                <hr>
                <h5>Yıllık Net Kâr Durumu:</h5>
                ${profitHTML}
            `;
        } catch (err) {
            card.innerHTML = `<p style="color:red;">Veri çekme hatası oluştu.</p>`;
        }
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const msg = input.value.trim();

        if (!msg) return;

        chatBox.innerHTML += `<div class="message user">${msg}</div>`;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: "demo_user", message: msg })
            });

            const data = await res.json();
            chatBox.innerHTML += `<div class="message bot">${data.reply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (err) {
            chatBox.innerHTML += `<div class="message bot">Hata oluştu.</div>`;
        }
    }
</script>

</body>
</html>

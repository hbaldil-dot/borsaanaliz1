services:
  - type: web
    name: bist-ai-analiz
    runtime: python
    repo: https://github.com/yourusername/bist-ai-analiz
    plan: starter
    region: frankfurt
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /
    autoDeploy: true

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapay Zeka Asistanı</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .chat-container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .chat-box { height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 5px; max-width: 80%; }
        .user { background: #007bff; color: white; margin-left: auto; text-align: right; }
        .bot { background: #e9ecef; color: black; }
        .input-box { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>Yapay Zeka Asistanı</h2>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-box">
        <input type="text" id="userInput" placeholder="Mesajınızı yazın..." onkeypress="handleKeyPress(event)">
        <button id="sendBtn" onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const chatBox = document.getElementById("chatBox");
        const message = input.value.trim();

        if (!message) return;

        // Kullanıcı mesajını ekle
        chatBox.innerHTML += `<div class="message user">${message}</div>`;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: "demo_user", message: message })
            });

            const data = await response.json();
            chatBox.innerHTML += `<div class="message bot">${data.reply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            // Eğer kotaya takılındıysa geri sayımı başlat
            if (data.retry_after && data.retry_after > 0) {
                startCountdown(data.retry_after);
            }

        } catch (error) {
            chatBox.innerHTML += `<div class="message bot">Bağlantı hatası oluştu.</div>`;
        }
    }

    function startCountdown(seconds) {
        const sendBtn = document.getElementById("sendBtn");
        const input = document.getElementById("userInput");
        
        sendBtn.disabled = true;
        input.disabled = true;

        let timeLeft = seconds;
        sendBtn.innerText = `Bekleyin (${timeLeft}s)`;

        const timer = setInterval(() => {
            timeLeft--;
            sendBtn.innerText = `Bekleyin (${timeLeft}s)`;

            if (timeLeft <= 0) {
                clearInterval(timer);
                sendBtn.disabled = false;
                input.disabled = false;
                sendBtn.innerText = "Gönder";
            }
        }, 1000);
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>

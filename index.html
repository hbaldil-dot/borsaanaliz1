<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borsa Analiz & AI Panel</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .main-container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; height: 85vh; }
        
        .sidebar { flex: 1; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 15px; position: relative; }
        .form-group { display: flex; flex-direction: column; gap: 5px; position: relative; }
        label { font-weight: bold; font-size: 14px; color: #333; }
        
        /* Aranabilir Dropdown Kutusu */
        .search-select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; text-transform: uppercase; cursor: pointer; }
        .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; right: 0; max-height: 220px; overflow-y: auto; background: white; border: 1px solid #ccc; border-radius: 0 0 5px 5px; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .dropdown-item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #eee; }
        .dropdown-item:hover { background-color: #007bff; color: white; }

        .stock-card { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ddd; flex: 1; overflow-y: auto; margin-top: 10px; }
        
        .chat-container { flex: 2; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .chat-box { flex: 1; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 5px; max-width: 80%; }
        .user { background: #007bff; color: white; margin-left: auto; }
        .bot { background: #e9ecef; color: black; }
        .input-box { display: flex; gap: 10px; }
        .input-box input { flex: 1; text-transform: none; }
        button.send-btn { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="sidebar">
        <h3>BIST Hisse Sorgula</h3>
        
        <div class="form-group">
            <label for="stockInput">Günün Hisse Listesi (Arayın veya Seçin):</label>
            <input type="text" id="stockInput" class="search-select" placeholder="Yükleniyor..." oninput="filterStocks()" onclick="showDropdown()" autocomplete="off">
            <div id="dropdownMenu" class="dropdown-menu"></div>
        </div>

        <div class="stock-card" id="stockCard">
            <h4>Hisse Seçin</h4>
            <p>Roll-down listeden bir hisse seçtiğinizde 15 dk gecikmeli veriler çekilecektir.</p>
        </div>
    </div>

    <div class="chat-container">
        <h3>Yapay Zeka Asistanı</h3>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Mesajınızı yazın..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">Gönder</button>
        </div>
    </div>
</div>

<script>
    let globalStockList = [];

    // Sayfa açıldığında sunucunun günde 1 kez güncellediği dinamik listeyi çeker
    window.onload = async function() {
        try {
            const res = await fetch('/api/stocks/list');
            const data = await res.json();
            globalStockList = data.stocks || [];
            
            document.getElementById("stockInput").placeholder = "Hisse Ara veya Aşağı Doğru Aç...";
            renderDropdown(globalStockList);
        } catch (err) {
            console.error("Hisse listesi alınamadı:", err);
            document.getElementById("stockInput").placeholder = "Liste yüklenemedi";
        }
    };

    function renderDropdown(list) {
        const menu = document.getElementById("dropdownMenu");
        menu.innerHTML = "";
        
        if (list.length === 0) {
            menu.innerHTML = `<div class="dropdown-item">Sonuç bulunamadı</div>`;
            return;
        }

        list.forEach(symbol => {
            const item = document.createElement("div");
            item.className = "dropdown-item";
            item.innerText = symbol;
            
            // Seçim yapılınca veri çekme işlemi tetiklenir
            item.onclick = function() {
                document.getElementById("stockInput").value = symbol;
                menu.style.display = "none";
                fetchStock(symbol);
            };
            menu.appendChild(item);
        });
    }

    function showDropdown() {
        document.getElementById("dropdownMenu").style.display = "block";
    }

    function filterStocks() {
        const query = document.getElementById("stockInput").value.trim().toUpperCase();
        const filtered = globalStockList.filter(s => s.includes(query));
        renderDropdown(filtered);
        document.getElementById("dropdownMenu").style.display = "block";
    }

    // Dışarı tıklanınca açılır menüyü kapatır
    document.addEventListener("click", function(e) {
        const input = document.getElementById("stockInput");
        const menu = document.getElementById("dropdownMenu");
        if (!input.contains(e.target) && !menu.contains(e.target)) {
            menu.style.display = "none";
        }
    });

    async function fetchStock(symbol) {
        if (!symbol) return;
        
        const card = document.getElementById("stockCard");
        card.innerHTML = `<p><strong>${symbol}</strong> verileri çekiliyor (15 dk gecikmeli)...</p>`;

        try {
            const res = await fetch(`/api/stock/${symbol}`);
            const data = await res.json();

            if (data.error) {
                card.innerHTML = `<p style="color:red;">Hata: ${data.error}</p>`;
                return;
            }

            let profitHTML = "<ul>";
            if (typeof data.profits === 'object' && Object.keys(data.profits).length > 0) {
                for (const [year, netProfit] of Object.entries(data.profits)) {
                    profitHTML += `<li><strong>${year}:</strong> ${netProfit}</li>`;
                }
                profitHTML += "</ul>";
            } else {
                profitHTML = `<p>${data.profits}</p>`;
            }

            card.innerHTML = `
                <h4>${data.symbol} Detayı</h4>
                <p><strong>Güncel Fiyat (15 dk gecikmeli):</strong> ${data.price}</p>
                <hr>
                <h5>Yıllık Net Kâr Durumu:</h5>
                ${profitHTML}
            `;
        } catch (err) {
            card.innerHTML = `<p style="color:red;">Veri çekme hatası oluştu.</p>`;
        }
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const msg = input.value.trim();

        if (!msg) return;

        chatBox.innerHTML += `<div class="message user">${msg}</div>`;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: "demo_user", message: msg })
            });

            const data = await res.json();
            chatBox.innerHTML += `<div class="message bot">${data.reply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (err) {
            chatBox.innerHTML += `<div class="message bot">Hata oluştu.</div>`;
        }
    }
</script>

</body>
</html>
